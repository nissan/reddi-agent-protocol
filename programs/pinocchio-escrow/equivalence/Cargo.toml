[package]
name = "pinocchio-escrow-equivalence"
version = "0.1.0"
description = "Runs the Anchor escrow test suite against the Pinocchio build"
edition = "2021"
publish = false

[features]
# Mirrors the Anchor crate's features so the copied tests keep their cfgs.
devnet = []
extended = ["escrow/extended"]

[dev-dependencies]
# The Anchor crate is used off chain only: its generated instruction and
# account builders encode every call the tests send, so the Pinocchio program
# receives exactly the bytes an existing client produces.
escrow = { path = "../../../archive/anchor-escrow", features = ["no-entrypoint"] }
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token"] }
litesvm = "0.16.0"
mollusk-svm = "0.15.1"
solana-account = "4.3.2"
solana-message = "4.4.1"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-sdk-ids = "3.1.0"
sha2 = { version = "0.10", default-features = false }

[[test]]
name = "reputation"
required-features = ["extended"]

[[test]]
name = "attestation"
required-features = ["extended"]

[[test]]
name = "per"
required-features = ["extended"]

# Its own workspace: the test harness pins older Solana crates than the
# program uses, and the program's lockfile should hold only what ships.
[workspace]
