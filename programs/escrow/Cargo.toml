[package]
name = "escrow"
version = "0.1.0"
description = "Trustless x402 agent-to-agent escrow — Reddi Agent Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
litesvm = "0.16.0"
mollusk-svm = "0.15.1"
solana-account = "4.3.2"
solana-message = "4.4.1"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-sdk-ids = "3.1.0"
sha2 = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
