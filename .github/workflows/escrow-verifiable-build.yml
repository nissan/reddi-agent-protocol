name: Escrow verifiable build

# Container (verifiable) build of the V1 program (programs/pinocchio-escrow, library
# pinocchio_escrow), so the mainnet binary hash does
# not depend on the machine that built it (owner decision, 21 November 2026). The
# image tag matches the pinned Agave baseline (4.2.2). Anyone can repeat this build
# with `solana-verify build` and compare the hash, and the same command backs
# `solana-verify verify-from-repo` once the program is on mainnet.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "programs/pinocchio-escrow/program/**"
      - "programs/pinocchio-escrow/Cargo.toml"
      - "programs/pinocchio-escrow/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/escrow-verifiable-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERIFY_VERSION: "0.5.2"
  BASE_IMAGE: "solanafoundation/solana-verifiable-build:4.2.2"

jobs:
  # Runs on every pull request, so the gate below always reports. The work runs only
  # when the pull request touches these paths (push and manual runs always do it).
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: '^(programs/pinocchio-escrow/program/|programs/pinocchio-escrow/Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/escrow-verifiable-build\.yml$)'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant to this workflow: $relevant"

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Verifiable build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mainnet
            features: ""
          - variant: devnet
            features: "--features devnet"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Cache solana-verify
        id: cache-verify
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache-verify.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version "${SOLANA_VERIFY_VERSION}" --locked

      - name: Pull build image
        run: docker pull "${BASE_IMAGE}"

      # The program is its own Cargo workspace, so the build is mounted there.
      - name: Build in container
        working-directory: programs/pinocchio-escrow
        run: |
          # shellcheck disable=SC2086
          solana-verify build --library-name pinocchio_escrow --base-image "${BASE_IMAGE}" -- ${{ matrix.features }}

      - name: Record hash
        id: hash
        run: |
          # The container leaves target/ owned by root, so the record and a copy of the
          # binary go to a runner-owned directory.
          out="${RUNNER_TEMP}/escrow-build"
          mkdir -p "$out"
          so=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          test -f "$so"
          hash=$(solana-verify get-executable-hash "$so")
          size=$(stat -c %s "$so")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          {
            echo "### V1 program (Pinocchio) ${{ matrix.variant }} build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${BASE_IMAGE}\` |"
            echo "| Features | \`${{ matrix.features || 'default' }}\` |"
            echo "| Size | ${size} bytes |"
            echo "| Executable hash | \`${hash}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"variant":"%s","commit":"%s","image":"%s","size":%s,"hash":"%s"}\n' \
            "${{ matrix.variant }}" "$GITHUB_SHA" "$BASE_IMAGE" "$size" "$hash" > "$out/escrow-${{ matrix.variant }}-build.json"
          cp "$so" "$out/pinocchio_escrow.so"
          # Also in the log, which can be read without downloading the artifact.
          echo "variant=${{ matrix.variant }} size=${size} sha256=$(sha256sum "$so" | cut -d' ' -f1) executable_hash=${hash}"

      - name: Upload binary and hash
        uses: actions/upload-artifact@v4
        with:
          name: escrow-${{ matrix.variant }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/escrow-build/pinocchio_escrow.so
            ${{ runner.temp }}/escrow-build/escrow-${{ matrix.variant }}-build.json
          if-no-files-found: error
          retention-days: 90

  # The tests in programs/pinocchio-escrow/equivalence embed
  # target/deploy/pinocchio_escrow.so. pinocchio-escrow-tests.yml builds that file on
  # the runner, which is not byte-identical to the container build that is deployed.
  # This job runs the same suite against the mainnet binary of record itself
  # (security round 2, S1-claude2-01) and fails if the file tested is not it.
  test-binary-of-record:
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    name: Tests against the binary of record (mainnet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The side-by-side suite embeds the Anchor binary as its reference.
      - name: Build the archived Anchor program (reference, default build)
        run: |
          cargo build-sbf --manifest-path archive/anchor-escrow/Cargo.toml
          rm -f target/deploy/*-keypair.json

      - name: Download the mainnet binary of record
        uses: actions/download-artifact@v4
        with:
          name: escrow-mainnet-${{ github.sha }}
          path: ${{ runner.temp }}/record

      - name: Put it where the tests embed it
        env:
          RECORD: ${{ runner.temp }}/record
        run: |
          set -euo pipefail
          want=$(jq -r .hash "$RECORD/escrow-mainnet-build.json")
          dest=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          mkdir -p "$(dirname "$dest")"
          cp "$RECORD/pinocchio_escrow.so" "$dest"
          # Executable hash = sha256 with trailing zero bytes removed (solana-verify get-executable-hash).
          got=$(python3 -c "import sys,hashlib;print(hashlib.sha256(open(sys.argv[1],'rb').read().rstrip(b'\\0')).hexdigest())" "$dest")
          echo "tested file: size=$(stat -c %s "$dest") sha256=$(sha256sum "$dest" | cut -d' ' -f1) executable_hash=$got record=$want"
          test -n "$want" && [ "$got" = "$want" ]

      - name: Anchor tests, side-by-side suite and the program's own tests against the binary of record
        working-directory: programs/pinocchio-escrow/equivalence
        run: cargo test -- --nocapture

      # cargo must not have rebuilt the program in the meantime.
      - name: The tested file is still the binary of record
        env:
          RECORD: ${{ runner.temp }}/record
        run: cmp "$RECORD/pinocchio_escrow.so" programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so

  # The check to require on main: passes when the work passed, or was not needed.
  gate:
    name: Verifiable build gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build, test-binary-of-record]
    if: always()
    steps:
      - env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.build.result }}
          TESTED: ${{ needs.test-binary-of-record.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT build=$RESULT tested=$TESTED"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" = "true" ] && { [ "$RESULT" != "success" ] || [ "$TESTED" != "success" ]; }; then exit 1; fi
