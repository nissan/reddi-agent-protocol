name: Escrow verifiable build

# Container (verifiable) build of the V1 program (programs/pinocchio-escrow, library
# pinocchio_escrow), so the mainnet binary hash does
# not depend on the machine that built it (owner decision, 21 November 2026). The
# image tag matches the pinned Agave baseline (4.2.2). Anyone can repeat this build
# with `solana-verify build` and compare the hash, and the same command backs
# `solana-verify verify-from-repo` once the program is on mainnet.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "programs/pinocchio-escrow/program/**"
      - "programs/pinocchio-escrow/Cargo.toml"
      - "programs/pinocchio-escrow/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/escrow-verifiable-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERIFY_VERSION: "0.5.2"
  BASE_IMAGE: "solanafoundation/solana-verifiable-build:4.2.2"

jobs:
  # Runs on every pull request, so the gate below always reports. The work runs only
  # when the pull request touches these paths (push and manual runs always do it).
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: '^(programs/pinocchio-escrow/program/|programs/pinocchio-escrow/Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/escrow-verifiable-build\.yml$)'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant to this workflow: $relevant"

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Verifiable build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mainnet
            features: ""
          - variant: devnet
            features: "--features devnet"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Cache solana-verify
        id: cache-verify
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache-verify.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version "${SOLANA_VERIFY_VERSION}" --locked

      - name: Pull build image
        run: docker pull "${BASE_IMAGE}"

      # The program is its own Cargo workspace, so the build is mounted there.
      - name: Build in container
        working-directory: programs/pinocchio-escrow
        run: |
          # shellcheck disable=SC2086
          solana-verify build --library-name pinocchio_escrow --base-image "${BASE_IMAGE}" -- ${{ matrix.features }}

      - name: Record hash
        id: hash
        run: |
          # The container leaves target/ owned by root, so the record and a copy of the
          # binary go to a runner-owned directory.
          out="${RUNNER_TEMP}/escrow-build"
          mkdir -p "$out"
          so=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          test -f "$so"
          hash=$(solana-verify get-executable-hash "$so")
          size=$(stat -c %s "$so")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          {
            echo "### V1 program (Pinocchio) ${{ matrix.variant }} build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image | \`${BASE_IMAGE}\` |"
            echo "| Features | \`${{ matrix.features || 'default' }}\` |"
            echo "| Size | ${size} bytes |"
            echo "| Executable hash | \`${hash}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"variant":"%s","commit":"%s","image":"%s","size":%s,"hash":"%s"}\n' \
            "${{ matrix.variant }}" "$GITHUB_SHA" "$BASE_IMAGE" "$size" "$hash" > "$out/escrow-${{ matrix.variant }}-build.json"
          cp "$so" "$out/pinocchio_escrow.so"

      - name: Upload binary and hash
        uses: actions/upload-artifact@v4
        with:
          name: escrow-${{ matrix.variant }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/escrow-build/pinocchio_escrow.so
            ${{ runner.temp }}/escrow-build/escrow-${{ matrix.variant }}-build.json
          if-no-files-found: error
          retention-days: 90

  # The check to require on main: passes when the work passed, or was not needed.
  gate:
    name: Verifiable build gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build]
    if: always()
    steps:
      - env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT work=$RESULT"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" = "true" ] && [ "$RESULT" != "success" ]; then exit 1; fi
