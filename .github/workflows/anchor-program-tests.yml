name: Anchor Program Tests

on:
  push:
    branches: [main]
    paths:
      - "programs/escrow/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".mise.toml"
      - "config/toolchain/solana-baseline-assets.json"
      - "scripts/check-solana-baseline-pins.mjs"
      - "scripts/solana-baseline-toolchain.sh"
      - "scripts/lib/solana-baseline-version-match.sh"
      - "scripts/__tests__/**"
      - ".github/workflows/anchor-program-tests.yml"
      - ".github/workflows/quasar-program-tests.yml"
      - ".github/workflows/surfpool-acceptance-manual.yml"
      - ".github/workflows/surfpool-quasar-critical-sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "programs/escrow/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".mise.toml"
      - "config/toolchain/solana-baseline-assets.json"
      - "scripts/check-solana-baseline-pins.mjs"
      - "scripts/solana-baseline-toolchain.sh"
      - "scripts/lib/solana-baseline-version-match.sh"
      - "scripts/__tests__/**"
      - ".github/workflows/anchor-program-tests.yml"
      - ".github/workflows/quasar-program-tests.yml"
      - ".github/workflows/surfpool-acceptance-manual.yml"
      - ".github/workflows/surfpool-quasar-critical-sdk.yml"
  workflow_dispatch:

jobs:
  anchor-program-tests:
    name: Legacy Anchor escrow tests (LiteSVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify pinned Solana toolchain baseline
        run: |
          npm run check:toolchain:baseline
          npm run test:toolchain:version-match
          npm run test:toolchain:modes
          npm run test:toolchain:runtime-status

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"

      # Every platform-tools release reports the same `rustc -vV` (1.89.0-dev),
      # so cargo cannot tell one apart from another and keeps SBF dependency
      # rlibs from a cached target/ when the Agave pin moves. Linking those old
      # rlibs into a freshly compiled escrow produces a program that loads and
      # then faults at runtime, so the toolchain pins must scope the cache in
      # both the key and the restore prefix — a bare lane prefix would restore
      # the previous toolchain's target/ anyway.
      - name: Cache Cargo registry and workspace target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-anchor-cargo-${{ hashFiles('rust-toolchain.toml', 'config/toolchain/solana-baseline-assets.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-anchor-cargo-${{ hashFiles('rust-toolchain.toml', 'config/toolchain/solana-baseline-assets.json') }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The LiteSVM tests embed target/deploy/escrow.so via include_bytes!,
      # so the SBF build must complete before the test crate compiles.
      - name: Build escrow program (SBF)
        run: cargo build-sbf --manifest-path programs/escrow/Cargo.toml

      - name: Run LiteSVM tests
        run: cargo test -p escrow
