name: Jest (lib suites)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jest:
    name: Jest lib/** suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest
        run: npm test -- --ci --maxWorkers=2

      # Offline: builds the rated lane's plan and instructions; opens no connection and reads no key.
      - name: Devnet escrow e2e, rated lane plan (offline)
        run: npm run test:e2e:devnet:escrow-rated-plan

      # Offline: the hourly uptime check fails when the site does (pipefail), and alerts the owner.
      - name: Uptime workflow guard (offline)
        run: npm run test:uptime-workflow

      # Offline: the deployment verifier against fixture accounts (wrong cluster, flipped byte, wrong authority).
      - name: Escrow deployment verifier (offline)
        run: npm run test:escrow:deployment-check

      # Offline: the emergency pause tool refuses an RPC on the wrong cluster and never echoes a key file.
      - name: Emergency pause tool (offline, loopback RPC only)
        run: npm run test:emergency-pause
