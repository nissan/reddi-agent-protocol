name: Jest (lib suites)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  jest:
    name: Jest lib/** suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Jest
        run: npm test -- --ci --maxWorkers=2

      # Offline: builds the rated lane's plan and instructions; opens no connection and reads no key.
      - name: Devnet escrow e2e, rated lane plan (offline)
        run: npm run test:e2e:devnet:escrow-rated-plan
