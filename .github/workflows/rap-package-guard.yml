name: RAP Package Publication Guard

on:
  pull_request:
    paths:
      - "packages/agent-protocol/**"
      - "app/economic-demo/paid-workflow/**"
      - "lib/economic-demo/**"
      - "scripts/check-paid-workflow-copy-boundaries.mjs"
      - "e2e/economic-demo-paid-workflow*.ts"
      - "docs/DISCOVER-DECIDE-PROVE-BOUNDARIES.md"
      - "scripts/lib/workflow-yaml.mjs"
      - "scripts/__tests__/surfpool-lane-boundaries.test.mjs"
      - ".github/workflows/rap-package-guard.yml"
      - ".github/workflows/quasar-readiness-guard.yml"
      - ".github/workflows/surfpool-quasar-critical-sdk.yml"
  workflow_dispatch:

jobs:
  rap-package-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/agent-protocol/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/agent-protocol

      - name: Build
        run: npm run build
        working-directory: packages/agent-protocol

      - name: Test
        run: npm test
        working-directory: packages/agent-protocol

      - name: Verify package exports resolution
        run: node scripts/check-package-exports.mjs
        working-directory: packages/agent-protocol

      - name: Verify package artifact contents (npm pack dry-run guard)
        run: node scripts/check-package-artifact-contents.mjs --dir packages/agent-protocol

      - name: Public conformance suite (#353)
        run: node scripts/run-public-conformance.mjs --skip-build

  paid-workflow-copy-boundary-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # Not this guard's own subject: it runs here so that an edit to any of the three workflow
      # files these guards cross-list is witnessed by a workflow other than the one being edited.
      # See docs/SURFPOOL-QUASAR-CRITICAL-SDK-LANE.md § Hosted CI.
      - name: Verify lane trigger and safety boundaries
        run: npm run test:surfpool:lane-boundaries

      - name: Copy-boundary regression gate (#501)
        run: node scripts/check-paid-workflow-copy-boundaries.mjs

      - name: Copy-boundary gate negative control (#501, must fail)
        run: |
          if node scripts/check-paid-workflow-copy-boundaries.mjs --negative-control; then
            echo "Negative control did not fail — the gate can no longer catch forbidden copy."
            exit 1
          fi
          echo "Negative control failed as expected (gate exits 1 on injected forbidden copy)."
