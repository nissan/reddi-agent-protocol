name: Providers app

# Builds and tests apps/providers, which serves RAP's first-party providers on
# Vercel through the provider kit. Offline: no secrets and no RPC. The launch
# bonus ledger is tested against a local Postgres with every migration applied.

on:
  pull_request:
    paths:
      - "apps/providers/**"
      - "packages/provider-kit/**"
      - "packages/x402-solana/**"
      - "packages/agent-protocol/**"
      - "deploy/first-party-providers/**"
      - "supabase/migrations/*provider_kit*.sql"
      - ".github/workflows/providers-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/providers/**"
      - "packages/provider-kit/**"
      - "packages/x402-solana/**"
      - "packages/agent-protocol/**"
      - "deploy/first-party-providers/**"
      - "supabase/migrations/*provider_kit*.sql"
      - ".github/workflows/providers-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: providers-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  providers-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/providers
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The same install Vercel runs (vercel.json): the kit is built from this repository.
      - name: Build the provider kit
        run: npm run build:kit

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Fails on any high or critical advisory in the app's production dependencies.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      # Local only: nothing leaves the runner. The tests connect as the
      # providers' own role, so its grants are what is tested.
      - name: Start Postgres with the migrations
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name rap-pg -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55432:5432 postgres:16.10
          for i in $(seq 1 60); do
            docker logs rap-pg 2>&1 | grep -q "PostgreSQL init process complete" && docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres
          for f in supabase/tests/00_supabase_stub.sql supabase/migrations/*.sql; do
            docker exec -i rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres < "$f"
          done
          docker exec rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres -c "alter role provider_kit_app login"

      - name: Tests
        env:
          RAP_TEST_DATABASE_URL: postgres://provider_kit_app@127.0.0.1:55432/postgres
        run: npm test
