name: E2E Funnel (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-funnel:
    name: Signup/onboarding funnel specs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Blocking lane for the user-facing signup/get-started funnel only.
      # No lane runs the full 39-spec suite: the nightly integration lane runs
      # e2e/integration.spec.ts alone, and the rest (evidence-capture specs,
      # the all-routes navigation smoke that needs a warm server, and the
      # /agents specs that wait on a devnet RPC read) run locally via
      # npm run test:e2e.
      - name: Run funnel specs
        env:
          PLAYWRIGHT_SCREENSHOT: off
          PLAYWRIGHT_VIDEO: off
        run: >
          npx playwright test
          e2e/home.spec.ts
          e2e/public-claim-boundary.spec.ts
          e2e/setup.spec.ts
          e2e/register.spec.ts
          e2e/register-local-sim.spec.ts
          e2e/register-local-success.spec.ts
          e2e/onboarding.spec.ts
          e2e/onboarding-intake.spec.ts
          e2e/onboarding-profile-editor.spec.ts
          e2e/onboarding-readiness-gate.spec.ts
          e2e/wallet-mock.spec.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
