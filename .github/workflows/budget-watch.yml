# Runs the pooled Budget watcher every 5 minutes (the Vercel plan runs crons
# daily only). The watcher alerts each payer on every reserve and post on a
# Budget the relay holds a key for. Needs the repository secret
# BUDGET_WATCH_CRON_SECRET (the app's CRON_SECRET); without it the job skips.
name: Budget watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: budget-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run the watcher
        env:
          CRON_SECRET: ${{ secrets.BUDGET_WATCH_CRON_SECRET }}
          APP_ORIGIN: https://app.agent-protocol.reddi.tech
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "BUDGET_WATCH_CRON_SECRET is not set; skipping."; exit 0; fi
          status=$(curl -sS -o /tmp/watch.json -w '%{http_code}' -H "authorization: Bearer $CRON_SECRET" "$APP_ORIGIN/api/cron/budget-watch")
          head -c 4000 /tmp/watch.json; echo
          test "$status" = 200
