# Runs the pooled Budget watcher, then the sandbox providers' Budget sweep, every 5 minutes (the Vercel plan runs crons
# daily only). The watcher alerts each payer on every reserve and post on a
# Budget the relay holds a key for. Needs the repository secret
# BUDGET_WATCH_CRON_SECRET (the app's CRON_SECRET): without it the run fails,
# as it does when any Budget could not be watched. GitHub schedules are best
# effort, so an uptime monitor on /api/cron/budget-watch/health is the real
# stall alarm (docs/BUDGET-RELAY-CUSTODY.md). The log shows only counts.
name: Budget watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: budget-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Three steps of up to 310 s each (the routes stop at 300 s), plus set-up.
    timeout-minutes: 18
    steps:
      - name: Run the watcher
        env:
          CRON_SECRET: ${{ secrets.BUDGET_WATCH_CRON_SECRET }}
          APP_ORIGIN: https://app.agent-protocol.reddi.tech
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "BUDGET_WATCH_CRON_SECRET is not set: the watcher cannot run."; exit 1; fi
          status=$(curl -sS -m 310 -o /tmp/watch.json -w '%{http_code}' -H "authorization: Bearer $CRON_SECRET" "$APP_ORIGIN/api/cron/budget-watch")
          echo "HTTP $status"
          jq -c '{ok, complete, budgets, errors, alerts}' /tmp/watch.json 2>/dev/null || echo "(no JSON summary)"
          test "$status" = 200
      - name: Settle the sandbox providers' Budget slices
        if: always()
        # The sweep runs on the separate devnet app (#1203) once the repository variable DEVNET_APP_ORIGIN and the
        # secret DEVNET_APP_CRON_SECRET (that app's CRON_SECRET) are both set; until then it stays on the main app.
        env:
          MAIN_CRON_SECRET: ${{ secrets.BUDGET_WATCH_CRON_SECRET }}
          DEVNET_CRON_SECRET: ${{ secrets.DEVNET_APP_CRON_SECRET }}
          DEVNET_APP_ORIGIN: ${{ vars.DEVNET_APP_ORIGIN }}
        run: |
          APP_ORIGIN=https://app.agent-protocol.reddi.tech
          CRON_SECRET="$MAIN_CRON_SECRET"
          if [ -n "$DEVNET_APP_ORIGIN" ] && [ -n "$DEVNET_CRON_SECRET" ]; then
            case "$DEVNET_APP_ORIGIN" in https://*) ;; *) echo "DEVNET_APP_ORIGIN must be an https origin."; exit 1 ;; esac
            APP_ORIGIN="${DEVNET_APP_ORIGIN%/}"
            CRON_SECRET="$DEVNET_CRON_SECRET"
          fi
          if [ -z "$CRON_SECRET" ]; then echo "No cron secret is set: the sweep cannot run."; exit 1; fi
          status=$(curl -sS -m 310 -o /tmp/sweep.json -w '%{http_code}' -H "authorization: Bearer $CRON_SECRET" "$APP_ORIGIN/api/cron/sandbox-budgets")
          echo "HTTP $status"
          jq -c '{ok, configured, slices, failed}' /tmp/sweep.json 2>/dev/null || echo "(no JSON summary)"
          test "$status" = 200
      - name: Record jobs for paid Budget slices
        if: always()
        env:
          CRON_SECRET: ${{ secrets.BUDGET_WATCH_CRON_SECRET }}
          APP_ORIGIN: https://app.agent-protocol.reddi.tech
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "BUDGET_WATCH_CRON_SECRET is not set: the job recorder cannot run."; exit 1; fi
          status=$(curl -sS -m 310 -o /tmp/jobs.json -w '%{http_code}' -H "authorization: Bearer $CRON_SECRET" "$APP_ORIGIN/api/cron/budget-jobs")
          echo "HTTP $status"
          jq -c '{ok, slices, recorded, unreadable, refused}' /tmp/jobs.json 2>/dev/null || echo "(no JSON summary)"
          test "$status" = 200
