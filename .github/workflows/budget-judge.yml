name: Budget judge

# Builds and type-checks apps/budget-judge, the only Vercel project that holds the
# RAP judge's key. It runs lib/budget/judge from the repository
# root, so it installs there, as Vercel does (apps/budget-judge/vercel.json).
# Offline: no secrets, no RPC, no key. The handlers are tested by the root Jest
# suite (lib/__tests__/budget-judge.test.ts).

on:
  pull_request:
    paths:
      - "apps/budget-judge/**"
      - "lib/budget/**"
      - "packages/agent-protocol/src/**"
      - "lib/http/cron-auth.ts"
      - "lib/http/outbound.ts"
      - "lib/supabase/config.ts"
      - "config/networks/devnet.json"
      - "packages/x402-solana/src/**"
      - "package-lock.json"
      - ".github/workflows/budget-judge.yml"
  push:
    branches: [main]
    paths:
      - "apps/budget-judge/**"
      - "lib/budget/**"
      - "packages/agent-protocol/src/**"
      - "lib/http/cron-auth.ts"
      - "lib/http/outbound.ts"
      - "lib/supabase/config.ts"
      - "config/networks/devnet.json"
      - "packages/x402-solana/src/**"
      - "package-lock.json"
      - ".github/workflows/budget-judge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-judge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  budget-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install (repository root, as on Vercel)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        working-directory: apps/budget-judge
        run: npm run build

      - name: Type check
        working-directory: apps/budget-judge
        run: npm run typecheck

      # The judge must never pull in pages or the main app's routes.
      - name: Only the judge's routes
        working-directory: apps/budget-judge
        run: |
          set -euo pipefail
          found=$(find app -type f | sort)
          expected=$(printf '%s\n' app/api/cron/judge/route.ts app/api/v1/evidence/route.ts app/api/v1/health/route.ts app/api/v1/ops/route.ts)
          if [ "$found" != "$expected" ]; then
            echo "apps/budget-judge/app holds files other than the four judge routes:"; echo "$found"; exit 1
          fi
