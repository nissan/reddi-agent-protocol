name: Release packages

# Publishes the V1 package set to npm (#831): @redditech/x402-solana, then
# @redditech/agent-protocol, then @redditech/provider-kit.
#
# - Pull requests that change this workflow or scripts/release/ run the dry run only.
# - A manual dispatch runs the dry run, then the publish job, which waits in the
#   `npm-release` environment until the owner approves it. Nothing is published
#   without that approval.
# - The release runs as four jobs, so no job that runs dependency code can
#   publish or push:
#   1. build: no secrets, read-only token, `npm ci --ignore-scripts`; packs each
#      package and uploads the tarballs.
#   2. publish: in the `npm-release` environment, checks out nothing, installs
#      nothing, and runs only `npm publish <tarball> --provenance`. It uses npm
#      trusted publishing (OIDC) only: no npm token is stored, so each package
#      needs a trusted publisher on npm for this repository and workflow.
#   3. smoke: installs the published kit from npm with no token and no rights.
#   4. tag: pushes one tag per package; it runs git only.
# - Actions are pinned by commit.
# - A dispatch can name the packages to publish (the `packages` input, default
#   all three), so a later release can ship some of them while the rest keep
#   the version already on npm. They are always published in dependency order.
# - If any package chosen for publishing is already on npm at its version, the
#   run fails before anything is published.

on:
  pull_request:
    paths:
      - ".github/workflows/release-packages.yml"
      - "scripts/release/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish, space separated (x402-solana agent-protocol provider-kit)"
        required: false
        default: "x402-solana agent-protocol provider-kit"

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PACKAGES: "x402-solana agent-protocol provider-kit"

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The provider kit's Postgres store tests need a real database, as in
      # package-tests.yml. Local only: nothing leaves the runner.
      - name: Start Postgres with the migrations
        run: |
          set -euo pipefail
          docker run -d --name rap-pg -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55432:5432 postgres:16.10
          # The image starts a temporary server while it initialises: wait for the real one.
          for i in $(seq 1 60); do
            docker logs rap-pg 2>&1 | grep -q "PostgreSQL init process complete" && docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres
          for f in supabase/tests/00_supabase_stub.sql supabase/migrations/*.sql; do
            docker exec -i rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres < "$f"
          done
          # The tests connect as the providers' own role, so its grants are what is tested.
          docker exec rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres -c "alter role provider_kit_app login"

      # Install scripts stay off here, as in the build job, so this proves the release builds without them.
      - name: Install, test and pack each package
        env:
          RAP_TEST_DATABASE_URL: postgres://provider_kit_app@127.0.0.1:55432/postgres
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::$p"
            (cd "packages/$p" && npm ci --ignore-scripts && npm run release:dry-run)
            echo "::endgroup::"
          done

      - name: Published manifests name registry versions only
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            node scripts/release/pin-local-deps.mjs "packages/$p"
            node scripts/release/pin-local-deps.mjs --check "packages/$p"
            node scripts/check-package-artifact-contents.mjs --dir "packages/$p"
          done

      # npm checks provenance against the manifest's repository, so it must
      # name this repository and the package's folder in it.
      - name: Manifests name this repository
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            node -e '
              const [dir, repo] = process.argv.slice(1);
              const r = require(`./${dir}/package.json`).repository ?? {};
              const url = String(r.url ?? "").replace(/^git\+/, "").replace(/\.git$/, "");
              if (url !== `https://github.com/${repo}` || r.directory !== dir) {
                console.error(`::error::${dir}/package.json: repository must be {url: git+https://github.com/${repo}.git, directory: ${dir}}`);
                process.exit(1);
              }
            ' "packages/$p" "$GITHUB_REPOSITORY"
          done

  build:
    name: Build release tarballs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.choose.outputs.publish }}
      versions: ${{ steps.pack.outputs.versions }}
      kit: ${{ steps.pack.outputs.kit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only names from the package set are taken, in dependency order.
      - name: Choose the packages to publish
        id: choose
        env:
          REQUESTED: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          set -f  # no globbing of the requested names
          requested=" $(printf '%s' "${REQUESTED:-$PACKAGES}" | tr -s '[:space:],' ' ') "
          for name in $requested; do
            case " $PACKAGES " in
              *" $name "*) ;;
              *) echo "::error::Unknown package '$name'; choose from: $PACKAGES"; exit 1 ;;
            esac
          done
          chosen=""
          for p in $PACKAGES; do
            case "$requested" in *" $p "*) chosen="$chosen $p" ;; esac
          done
          chosen="${chosen# }"
          if [ -z "$chosen" ]; then echo "::error::No package chosen."; exit 1; fi
          echo "Publishing: $chosen"
          echo "PUBLISH=$chosen" >> "$GITHUB_ENV"
          echo "publish=$chosen" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Refuse versions already on npm
        run: |
          set -euo pipefail
          for p in $PUBLISH; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if out=$(npm view "$name@$version" version 2>&1); then
              if [ -n "$out" ]; then
                echo "::error::$name@$version is already on npm. Bump the version; nothing was published."
                exit 1
              fi
            elif ! printf '%s' "$out" | grep -q 'E404'; then
              echo "::error::Could not check $name@$version on npm; nothing was published."
              printf '%s\n' "$out"
              exit 1
            fi
            echo "$name@$version is not on npm yet"
          done

      - name: Build and pack in dependency order
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release
          for p in $PUBLISH; do
            echo "::group::$p"
            (cd "packages/$p" && npm ci --ignore-scripts && npm run build)
            # A tarball publish skips lifecycle scripts, so a package's own pre-publish checks run here.
            if node -e "process.exit(require('./packages/$p/package.json').scripts?.prepublishOnly ? 0 : 1)"; then
              (cd "packages/$p" && npm run prepublishOnly)
            fi
            node scripts/release/pin-local-deps.mjs "packages/$p"
            node scripts/release/pin-local-deps.mjs --check "packages/$p"
            node scripts/check-package-artifact-contents.mjs --dir "packages/$p"
            tarball=$(cd "packages/$p" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release" | tail -n 1)
            echo "$tarball" >> release/order.txt
            echo "::endgroup::"
          done
          versions=""
          for p in $PUBLISH; do
            versions="$versions $(node -p "const m = require('./packages/$p/package.json'); m.name + '@' + m.version")"
          done
          echo "versions=${versions# }" >> "$GITHUB_OUTPUT"
          echo "kit=$(node -p "require('./packages/provider-kit/package.json').version")" >> "$GITHUB_OUTPUT"
          cat release/order.txt
          (cd release && sha256sum *.tgz)

      - name: Upload the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      id-token: write
    steps:
      - name: Download the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: release

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g --ignore-scripts npm@11.6.2 && npm --version

      # Nothing is checked out or installed in this job: it publishes the packed tarballs only.
      - name: Publish in dependency order
        run: |
          set -euo pipefail
          while IFS= read -r tarball; do
            [ -n "$tarball" ] || continue
            echo "::group::$tarball"
            npm publish "./release/$tarball" --access public --provenance --ignore-scripts
            echo "::endgroup::"
          done < release/order.txt

  smoke:
    name: Install from npm and run the no-spend quickstart
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The kit is installed only when this run published it: a run that ships
      # another package alone must not wait for a kit version that is not on
      # npm yet. Each published package is installed at its own version.
      - name: Install what was published and run it
        env:
          KIT: ${{ needs.build.outputs.kit }}
          PUBLISH: ${{ needs.build.outputs.publish }}
          VERSIONS: ${{ needs.build.outputs.versions }}
        run: |
          set -euo pipefail
          set -f
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init -y >/dev/null
          install() {
            # A first version can take several minutes to become visible.
            for i in $(seq 1 30); do
              npm install "$1" && return 0
              [ "$i" = 30 ] && { echo "::error::$1 is still not on the registry"; exit 1; }
              echo "Waiting for the registry"; sleep 30
            done
          }
          for spec in $VERSIONS; do
            case "$spec" in @redditech/x402-solana@*|@redditech/agent-protocol@*|@redditech/provider-kit@*) ;; *) echo "::error::Unexpected package '$spec'"; exit 1 ;; esac
            install "$spec"
          done
          case " $PUBLISH " in
            *" provider-kit "*)
              npx --no-install rap-provider --help
              node --input-type=module -e "await import('@redditech/provider-kit'); await import('@redditech/agent-protocol'); console.log('imports ok')"
              node -e "require('@redditech/x402-solana'); console.log('x402 require ok')"
              ;;
            *)
              echo "The provider kit was not published by this run (repository version $KIT); checking the published packages only."
              for spec in $VERSIONS; do
                name="${spec%@*}"
                node --input-type=module -e "await import(process.argv[1]); console.log(process.argv[1], 'import ok')" "$name"
              done
              ;;
          esac

  tag:
    name: Tag the released commit
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job runs git only; it needs the token to push the tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push one tag per package
        env:
          PUBLISH: ${{ needs.build.outputs.publish }}
        run: |
          set -euo pipefail
          set -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in $PUBLISH; do
            case " $PACKAGES " in *" $p "*) ;; *) echo "::error::Unknown package '$p'"; exit 1 ;; esac
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            git tag -a "$name@$version" -m "$name $version"
            git push origin "refs/tags/$name@$version"
          done
