name: Release packages

# Publishes the V1 package set to npm (#831): @redditech/x402-solana, then
# @redditech/agent-protocol, then @redditech/provider-kit.
#
# - Pull requests that change this workflow or scripts/release/ run the dry run only.
# - A manual dispatch runs the dry run, then the publish job, which waits in the
#   `npm-release` environment until the owner approves it. Nothing is published
#   without that approval.
# - Publishing uses npm trusted publishing (OIDC) with provenance. If the
#   environment holds an `NPM_TOKEN` secret (for a package's first version,
#   before a trusted publisher can be set on npm), it is used instead; it never
#   leaves the environment.
# - If any package's version is already on npm, the run fails before anything
#   is published.

on:
  pull_request:
    paths:
      - ".github/workflows/release-packages.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PACKAGES: "x402-solana agent-protocol provider-kit"

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install, test and pack each package
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::$p"
            (cd "packages/$p" && npm ci && npm run release:dry-run)
            echo "::endgroup::"
          done

      - name: Published manifests name registry versions only
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            node scripts/release/pin-local-deps.mjs "packages/$p"
            node scripts/release/pin-local-deps.mjs --check "packages/$p"
            node scripts/check-package-artifact-contents.mjs --dir "packages/$p"
          done

  publish:
    name: Publish to npm
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11.6.2 && npm --version

      - name: Refuse versions already on npm
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if out=$(npm view "$name@$version" version 2>&1); then
              if [ -n "$out" ]; then
                echo "::error::$name@$version is already on npm. Bump the version; nothing was published."
                exit 1
              fi
            elif ! printf '%s' "$out" | grep -q 'E404'; then
              echo "::error::Could not check $name@$version on npm; nothing was published."
              printf '%s\n' "$out"
              exit 1
            fi
            echo "$name@$version is not on npm yet"
          done

      - name: Build and publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            echo "::group::$p"
            (cd "packages/$p" && npm ci && npm run build)
            node scripts/release/pin-local-deps.mjs "packages/$p"
            node scripts/release/pin-local-deps.mjs --check "packages/$p"
            node scripts/check-package-artifact-contents.mjs --dir "packages/$p"
            (cd "packages/$p" && npm publish --access public --provenance)
            echo "::endgroup::"
          done

      - name: Install from npm and run the no-spend quickstart
        run: |
          set -euo pipefail
          kit=$(node -p "require('./packages/provider-kit/package.json').version")
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init -y >/dev/null
          for i in 1 2 3 4 5; do
            npm install "@redditech/provider-kit@$kit" && break
            echo "Waiting for the registry"; sleep 20
          done
          npx --no-install rap-provider --help
          node --input-type=module -e "await import('@redditech/provider-kit'); await import('@redditech/agent-protocol'); console.log('imports ok')"
          node -e "require('@redditech/x402-solana'); console.log('x402 require ok')"

      - name: Tag the released commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- packages
          for p in $PACKAGES; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            git tag -a "$name@$version" -m "$name $version"
            git push origin "refs/tags/$name@$version"
          done
