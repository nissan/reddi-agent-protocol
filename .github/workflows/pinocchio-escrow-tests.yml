name: V1 program tests (Pinocchio)

# Builds the V1 on-chain program (programs/pinocchio-escrow), one build with no
# feature flags, and tests it three ways. For the 13 escrow and registry
# instructions it is checked against the archived Anchor program
# (archive/anchor-escrow), which is kept as their behavioural reference: the
# Anchor program's own tests run unchanged against the Pinocchio binary, and a
# side-by-side suite replays the same transactions on both builds. The rating
# and attestation instructions, which the Anchor program does not have in this
# form, are tested by the program's own tests against the Pinocchio binary.
#
# Nothing here deploys, creates keys or signs anything. The container
# (verifiable) build is in escrow-verifiable-build.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "programs/pinocchio-escrow/**"
      - "archive/anchor-escrow/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pinocchio-escrow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on every pull request, so the gate below always reports. The work runs only
  # when the pull request touches these paths (push and manual runs always do it).
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: '^(programs/pinocchio-escrow/|archive/anchor-escrow/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/pinocchio-escrow-tests\.yml$)'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant to this workflow: $relevant"

  equivalence:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Equivalence with the Anchor build (LiteSVM / Mollusk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Copied Anchor tests are current
        run: programs/pinocchio-escrow/scripts/sync-equivalence-tests.sh --check

      # The side-by-side suite embeds the Anchor binary as its reference.
      - name: Build the archived Anchor program (reference, default build)
        run: cargo build-sbf --manifest-path archive/anchor-escrow/Cargo.toml

      - name: Build the Pinocchio program (mainnet variant)
        working-directory: programs/pinocchio-escrow
        run: cargo build-sbf --manifest-path program/Cargo.toml --sbf-out-dir target/deploy

      # cargo build-sbf writes a throwaway keypair next to each binary. Nothing
      # uses it, so it is removed before any later step can pick it up.
      - name: Remove generated keypair files
        run: rm -f target/deploy/*-keypair.json programs/pinocchio-escrow/target/deploy/*-keypair.json

      - name: Format and lint
        working-directory: programs/pinocchio-escrow
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features per -- -D warnings
          cd equivalence
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: programs/pinocchio-escrow
        run: |
          cargo test -p pinocchio-escrow
          cargo test -p pinocchio-escrow --features per

      - name: Anchor tests, side-by-side suite and the program's own tests against the Pinocchio binary
        working-directory: programs/pinocchio-escrow/equivalence
        run: cargo test -- --nocapture

      - name: Record sizes
        run: |
          anchor=target/deploy/escrow.so
          pinocchio=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          {
            echo "### Program size"
            echo ""
            echo "| Build | Bytes | sha256 |"
            echo "|---|---|---|"
            echo "| Anchor (default) | $(stat -c %s "$anchor") | \`$(sha256sum "$anchor" | cut -d' ' -f1)\` |"
            echo "| Pinocchio (mainnet variant) | $(stat -c %s "$pinocchio") | \`$(sha256sum "$pinocchio" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$anchor" "$pinocchio"

      # PER tracking is not part of the V1 build. It is built and tested behind
      # the `per` feature, against the Anchor reference built with its
      # `extended` feature. These steps overwrite both binaries, so they run
      # last.
      - name: Build the per variant, and the Anchor reference with the extended feature
        run: |
          cargo build-sbf --manifest-path archive/anchor-escrow/Cargo.toml --features extended
          cd programs/pinocchio-escrow
          cargo build-sbf --manifest-path program/Cargo.toml --sbf-out-dir target/deploy --features per
          rm -f target/deploy/*-keypair.json ../../target/deploy/*-keypair.json

      - name: All tests again, and the PER tests, per build
        working-directory: programs/pinocchio-escrow/equivalence
        run: cargo test --features per -- --nocapture

      - name: Record per sizes
        run: |
          anchor=target/deploy/escrow.so
          pinocchio=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          {
            echo "### Program size, per build (not for mainnet)"
            echo ""
            echo "| Build | Bytes |"
            echo "|---|---|"
            echo "| Anchor (extended) | $(stat -c %s "$anchor") |"
            echo "| Pinocchio (per) | $(stat -c %s "$pinocchio") |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$anchor" "$pinocchio"

  # The check to require on main: passes when the work passed, or was not needed.
  gate:
    name: Program tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, equivalence]
    if: always()
    steps:
      - env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.equivalence.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT work=$RESULT"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" = "true" ] && [ "$RESULT" != "success" ]; then exit 1; fi
