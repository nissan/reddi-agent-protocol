name: V1 program tests (Pinocchio)

# Builds the V1 on-chain program (programs/pinocchio-escrow) and checks it
# against the archived Anchor program (archive/anchor-escrow), which is kept as
# the behavioural reference: the Anchor program's own tests run unchanged
# against the Pinocchio binary, and a side-by-side suite replays the same
# transactions on both builds.
#
# Nothing here deploys, creates keys or signs anything. The container
# (verifiable) build is in escrow-verifiable-build.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - "programs/pinocchio-escrow/**"
      - "archive/anchor-escrow/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pinocchio-escrow-tests.yml"
  push:
    branches: [main]
    paths:
      - "programs/pinocchio-escrow/**"
      - "archive/anchor-escrow/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pinocchio-escrow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    name: Equivalence with the Anchor build (LiteSVM / Mollusk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Copied Anchor tests are current
        run: programs/pinocchio-escrow/scripts/sync-equivalence-tests.sh --check

      # The side-by-side suite embeds the Anchor binary as its reference.
      - name: Build the archived Anchor program (reference, default build)
        run: cargo build-sbf --manifest-path archive/anchor-escrow/Cargo.toml

      - name: Build the Pinocchio program (mainnet variant)
        working-directory: programs/pinocchio-escrow
        run: cargo build-sbf --manifest-path program/Cargo.toml --sbf-out-dir target/deploy

      # cargo build-sbf writes a throwaway keypair next to each binary. Nothing
      # uses it, so it is removed before any later step can pick it up.
      - name: Remove generated keypair files
        run: rm -f target/deploy/*-keypair.json programs/pinocchio-escrow/target/deploy/*-keypair.json

      - name: Format and lint
        working-directory: programs/pinocchio-escrow
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features extended -- -D warnings

      - name: Unit tests
        working-directory: programs/pinocchio-escrow
        run: |
          cargo test -p pinocchio-escrow
          cargo test -p pinocchio-escrow --features extended

      - name: Anchor tests and side-by-side suite against the Pinocchio binary
        working-directory: programs/pinocchio-escrow/equivalence
        run: cargo test -- --nocapture

      - name: Record sizes
        run: |
          anchor=target/deploy/escrow.so
          pinocchio=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          {
            echo "### Program size"
            echo ""
            echo "| Build | Bytes | sha256 |"
            echo "|---|---|---|"
            echo "| Anchor (default) | $(stat -c %s "$anchor") | \`$(sha256sum "$anchor" | cut -d' ' -f1)\` |"
            echo "| Pinocchio (mainnet variant) | $(stat -c %s "$pinocchio") | \`$(sha256sum "$pinocchio" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$anchor" "$pinocchio"

      # Rating, attestation and PER are not part of the V1 build. They are
      # built and tested behind the `extended` feature on both programs. These
      # steps overwrite both binaries, so they run last.
      - name: Build both programs with the extended feature
        run: |
          cargo build-sbf --manifest-path archive/anchor-escrow/Cargo.toml --features extended
          cd programs/pinocchio-escrow
          cargo build-sbf --manifest-path program/Cargo.toml --sbf-out-dir target/deploy --features extended
          rm -f target/deploy/*-keypair.json ../../target/deploy/*-keypair.json

      - name: Anchor tests and side-by-side suite, extended build
        working-directory: programs/pinocchio-escrow/equivalence
        run: cargo test --features extended -- --nocapture

      - name: Record extended sizes
        run: |
          anchor=target/deploy/escrow.so
          pinocchio=programs/pinocchio-escrow/target/deploy/pinocchio_escrow.so
          {
            echo "### Program size, extended build"
            echo ""
            echo "| Build | Bytes |"
            echo "|---|---|"
            echo "| Anchor (extended) | $(stat -c %s "$anchor") |"
            echo "| Pinocchio (extended) | $(stat -c %s "$pinocchio") |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l "$anchor" "$pinocchio"
