name: Surfpool Acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Acceptance lane to run"
        required: true
        default: "critical"
        type: choice
        options:
          - critical
          - quasar-critical
          - onboarding
          - onboarding-wrapper
          - jupiter-invoke

jobs:
  surfpool-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain for SDK critical lanes
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Install Solana CLI for SDK critical lanes
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.13/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Run selected Surfpool lane
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.lane }}" in
            critical)
              npm run test:surfpool:critical
              ;;
            quasar-critical)
              npm run test:surfpool:quasar-critical
              ;;
            onboarding)
              npm run test:surfpool:onboarding
              ;;
            onboarding-wrapper)
              npm run test:surfpool:onboarding-wrapper
              ;;
            jupiter-invoke)
              npm run test:surfpool:jupiter-invoke
              ;;
            *)
              echo "Unknown lane: ${{ github.event.inputs.lane }}" >&2
              exit 1
              ;;
          esac

      - name: Upload Surfpool artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-artifacts-${{ github.run_id }}-${{ github.event.inputs.lane }}
          path: artifacts/surfpool*/**
          if-no-files-found: warn
          retention-days: 14
