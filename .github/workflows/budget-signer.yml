name: Budget signer

# Builds and type-checks apps/budget-signer, the only Vercel project the Budget
# KMS issuer is granted to. It runs lib/budget from the repository root, so it
# installs there, as Vercel does (apps/budget-signer/vercel.json). Offline: no
# secrets, no RPC, no KMS. The handlers are tested by the root Jest suite
# (lib/__tests__/budget-custody.test.ts).

on:
  pull_request:
    paths:
      - "apps/budget-signer/**"
      - "lib/budget/**"
      - "lib/http/cron-auth.ts"
      - "lib/http/outbound.ts"
      - "lib/supabase/config.ts"
      - "config/networks/devnet.json"
      - "config/releases/v1-mainnet-83045ee.json"
      - "packages/x402-solana/src/**"
      - "package-lock.json"
      - ".github/workflows/budget-signer.yml"
  push:
    branches: [main]
    paths:
      - "apps/budget-signer/**"
      - "lib/budget/**"
      - "lib/http/cron-auth.ts"
      - "lib/http/outbound.ts"
      - "lib/supabase/config.ts"
      - "config/networks/devnet.json"
      - "config/releases/v1-mainnet-83045ee.json"
      - "packages/x402-solana/src/**"
      - "package-lock.json"
      - ".github/workflows/budget-signer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-signer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  budget-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install (repository root, as on Vercel)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        working-directory: apps/budget-signer
        run: npm run build

      - name: Type check
        working-directory: apps/budget-signer
        run: npm run typecheck

      # The signer must never pull in pages or the main app's routes.
      - name: Only the signer's routes
        working-directory: apps/budget-signer
        run: |
          set -euo pipefail
          found=$(find app -type f | sort)
          expected=$(printf '%s\n' app/api/v1/approve/route.ts app/api/v1/freeze/route.ts app/api/v1/health/route.ts app/api/v1/incident/route.ts app/api/v1/sign-call/route.ts)
          if [ "$found" != "$expected" ]; then
            echo "apps/budget-signer/app holds files other than the five signer routes:"; echo "$found"; exit 1
          fi
