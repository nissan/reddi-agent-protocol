name: Package tests

# Runs each listed package's own `npm test`. Before this workflow these packages' tests
# ran in no workflow at all (issue 714). Offline: no secrets, no RPC endpoint, no wallet.
# packages/per-client's tests replace the client's internal TEE connection with a
# recorder, so none of them reaches devnet.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/x402-solana/**"
      - "packages/rap-mcp-bridge/**"
      - "packages/openrouter-specialists/**"
      - "packages/eliza-plugin-x402/**"
      - "packages/sendai-x402/**"
      - "packages/per-client/**"
      - "packages/provider-kit/**"
      - "packages/agent-protocol/**"
      - "supabase/migrations/*provider_kit*.sql"
      - ".github/workflows/package-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every pull request, so the gate below always reports. The work runs only
  # when the pull request touches these paths (push and manual runs always do it).
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATTERN: '^(packages/(x402-solana|rap-mcp-bridge|openrouter-specialists|eliza-plugin-x402|sendai-x402|per-client|provider-kit|agent-protocol)/|supabase/migrations/[^/]*provider_kit[^/]*\.sql$|\.github/workflows/package-tests\.yml$)'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant to this workflow: $relevant"

  package-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [x402-solana, rap-mcp-bridge, openrouter-specialists, eliza-plugin-x402, sendai-x402, per-client, provider-kit]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Every other package here depends on the built x402-solana
      # package through a file: dependency.
      - name: Install and build the shared x402-solana package
        if: matrix.package != 'x402-solana'
        working-directory: packages/x402-solana
        run: |
          npm ci
          npm run build

      # The provider kit also loads the committed agent-protocol dist/ through a
      # file: dependency, which needs that package's own runtime dependencies.
      - name: Install the shared agent-protocol package's dependencies
        if: matrix.package == 'provider-kit'
        working-directory: packages/agent-protocol
        run: npm ci --omit=dev

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm ci

      # The provider kit's Postgres stores are tested against a real database
      # with every migration applied over the Supabase stand-in the access-rule
      # checks use. Local only: nothing leaves the runner.
      - name: Start Postgres with the migrations
        if: matrix.package == 'provider-kit'
        run: |
          set -euo pipefail
          docker run -d --name rap-pg -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55432:5432 postgres:16.10
          # The image starts a temporary server while it initialises: wait for the real one.
          for i in $(seq 1 60); do
            docker logs rap-pg 2>&1 | grep -q "PostgreSQL init process complete" && docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rap-pg pg_isready -h 127.0.0.1 -U postgres
          for f in supabase/tests/00_supabase_stub.sql supabase/migrations/*.sql; do
            docker exec -i rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres < "$f"
          done
          # The tests connect as the providers' own role, so its grants are what is tested.
          docker exec rap-pg psql -X -q -v ON_ERROR_STOP=1 -U postgres -c "alter role provider_kit_app login"

      - name: Run the package's tests
        working-directory: packages/${{ matrix.package }}
        env:
          RAP_TEST_DATABASE_URL: ${{ matrix.package == 'provider-kit' && 'postgres://provider_kit_app@127.0.0.1:55432/postgres' || '' }}
        run: npm test

      # The app imports x402-solana's source, but other packages and consumers load the
      # committed dist/. Fail when it was not rebuilt after a source change.
      - name: Check the committed dist matches the source
        if: matrix.package == 'x402-solana'
        working-directory: packages/x402-solana
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "::error::packages/x402-solana/dist is stale: run npm run build and commit dist/"; exit 1; }

  # The check to require on main: passes when the work passed, or was not needed.
  gate:
    name: Package tests gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, package-tests]
    if: always()
    steps:
      - env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.package-tests.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT work=$RESULT"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" = "true" ] && [ "$RESULT" != "success" ]; then exit 1; fi
