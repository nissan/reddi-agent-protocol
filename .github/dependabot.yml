# Dependency updates, tuned for the launch window (V1 launch 5 Dec 2026).
#
# - One weekly run (Monday morning Sydney) across every npm lockfile, grouped so a
#   week normally yields a handful of PRs, not dozens.
# - Payment and signing libraries (@solana/*, @noble/*, x402, bs58, tweetnacl,
#   MagicBlock) get their own group so they can go to security review on their own.
# - Major versions are ignored until after launch. Remove the semver-major ignore
#   rules after 5 Dec 2026 to resume them.
# - Cargo is paused: the on-chain program is frozen at 45e9547 for the security
#   go/no-go. Restore the cargo entries after launch.
# - Frozen evidence (experiments/, pilots/, archive/) is left out on purpose.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/marketing"
      - "/packages/x402-solana"
      - "/packages/agent-protocol"
      - "/packages/provider-kit"
      - "/packages/openrouter-specialists"
      - "/packages/rap-mcp-bridge"
      - "/packages/demo-agents"
      - "/packages/eliza-plugin-x402"
      - "/packages/sendai-x402"
      - "/packages/testing-specialists"
      - "/packages/per-client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      payments-and-signing:
        patterns:
          - "@solana/*"
          - "@noble/*"
          - "@coral-xyz/*"
          - "@magicblock-labs/*"
          - "@x402/*"
          - "x402*"
          - "bs58"
          - "tweetnacl"
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
